name: JSX Daily Compliance Report

on:
  # No native cron: the platform's dispatcher fires this at 9:09 AM Eastern
  # from Monitoring/schedules.json (same pattern as the PSA daily report).
  workflow_dispatch:
    inputs:
      recipients:
        description: "Override recipients (comma-separated) — for testing"
        required: false
        default: ""
      dry_run:
        description: "1 = build the workbook, send nothing"
        required: false
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl requests

      # Deliberately NO data-refresh step: generate_data.py also runs the
      # service-request fulfillment checks and emails, and running it here
      # without committing requests.json would double-send them. The
      # committed data.json is at most an hour old (hourly data_refresh).
      - name: Build and send report
        env:
          TENANT_ID:           ${{ secrets.TENANT_ID }}
          CLIENT_ID:           ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET:       ${{ secrets.CLIENT_SECRET }}
          RECIPIENTS_OVERRIDE: ${{ inputs.recipients }}
          DRY_RUN:             ${{ inputs.dry_run }}
        run: python jsx_daily_report.py
