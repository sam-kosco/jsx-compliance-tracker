name: Mirror to legacy URL
# The canonical repo moved to the org; old links (sam-kosco.github.io)
# stay live via a mirror repo on Sam's personal account until the platform
# is rolled out and the legacy URLs are retired. Pushes main to the mirror
# after every data refresh, plus a daily backstop.
on:
  push:
    branches: [main]
  workflow_run:
    types: [completed]
    workflows:
      - "JSX Compliance Data Refresh"
      - "Manage Service Requests"
  schedule:
    - cron: "45 9 * * *"
  workflow_dispatch:

# Refreshes can finish near-simultaneously; serialize the mirror pushes
# so two force-pushes never race (2026-08-21: one such race failed).
concurrency:
  group: mirror-legacy
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if the mirror already matches
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same-SHA short-circuit: the mirror's strip commit sits directly on
          # the org head it mirrored, so its PARENT sha tells us what the
          # mirror serves — no checkout needed to compare. workflow_run fires
          # after every refresher completion (mostly no-op probes), and the
          # full-history checkout + force-push of this repo was the expensive
          # part of ~150 mirror runs/day org-wide.
          OURS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" -q .sha)
          THEIRS=$(gh api "repos/sam-kosco/jsx-compliance-tracker/commits/main"                    -q '.parents[0].sha' 2>/dev/null || true)
          if [ -n "$OURS" ] && [ "$OURS" = "$THEIRS" ]; then
            echo "mirror already at $OURS — nothing to push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "mirror parent=$THEIRS ours=$OURS — pushing"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.sync.outputs.changed == 'true'
        with:
          fetch-depth: 0
      - name: Push main to the legacy mirror
        if: steps.sync.outputs.changed == 'true'
        env:
          KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          # The mirror is a Pages site only: strip workflow files so nothing
          # can run (or fail spam) over there. Its repo keeps Actions ENABLED
          # because branch-built Pages deploy via the internal
          # pages-build-deployment workflow - disabling Actions freezes the
          # site (2026-08-21 incident: mirrors stale at Aug 19).
          git config user.name "mirror-bot"
          git config user.email "foxtrot.automation@foxtrotaviation.com"
          git rm -rq --ignore-unmatch .github/workflows
          git commit -qm "mirror: strip workflows" --allow-empty
          git push --force git@github.com:sam-kosco/jsx-compliance-tracker.git HEAD:main
